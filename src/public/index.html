<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Logeshwari Mart</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f3fb;
            color: #333;
        }

        header {
            background: #6a1b9a;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            font-size: 26px;
        }

        nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav button {
            background: white;
            color: #6a1b9a;
            border: none;
            padding: 9px 13px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        nav button:hover {
            background: #eee;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .hero {
            background: linear-gradient(135deg, #7b1fa2, #ab47bc);
            color: white;
            padding: 60px 30px;
            border-radius: 15px;
            text-align: center;
        }

        .hero h2 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .primary-btn {
            background: #6a1b9a;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary-btn:hover {
            background: #4a148c;
        }

        .white-btn {
            background: white;
            color: #6a1b9a;
            border: none;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .form-box {
            background: white;
            padding: 25px;
            max-width: 500px;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .form-box h2 {
            color: #6a1b9a;
            margin-bottom: 20px;
            text-align: center;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        label {
            font-weight: bold;
        }

        .message {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .filter-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .filter-row {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 10px;
            align-items: end;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .product-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .product-card h3 {
            color: #6a1b9a;
            margin-bottom: 10px;
        }

        .product-card p {
            margin: 7px 0;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: #2e7d32;
            margin: 12px 0;
        }

        .product-card button {
            margin-top: 8px;
            margin-right: 5px;
        }

        .cart-item,
        .order-card,
        .review-card {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }

        .quantity-controls button {
            width: 32px;
            height: 32px;
            border: none;
            background: #6a1b9a;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .cart-total {
            background: #6a1b9a;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: right;
        }

        .empty {
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 10px;
        }

        footer {
            margin-top: 50px;
            background: #4a148c;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
            }

            .filter-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>Logeshwari Mart 💜</h1>

    <nav>
        <button onclick="showSection('home')">Home</button>
        <button onclick="showSection('products'); loadProducts()">Products</button>
        <button onclick="showSection('login')">Login</button>
        <button onclick="showSection('register')">Register</button>
        <button onclick="openCart()">Cart 🛒</button>
        <button onclick="openOrders()">Orders 📦</button>
        <button onclick="logoutUser()">Logout</button>
    </nav>

</header>


<div class="container">


    <!-- HOME -->

    <section id="home" class="section active">

        <div class="hero">

            <h2>Welcome to Logeshwari Mart 💜</h2>

            <p>
                Everything you love, in one place.
            </p>

            <button
                class="white-btn"
                onclick="showSection('products'); loadProducts()">

                Shop Now

            </button>

        </div>

    </section>


    <!-- REGISTER -->

    <section id="register" class="section">

        <div class="form-box">

            <h2>Create Account</h2>

            <form onsubmit="registerUser(event)">

                <label>Name</label>

                <input
                    type="text"
                    id="registerName"
                    required>


                <label>Email</label>

                <input
                    type="email"
                    id="registerEmail"
                    required>


                <label>Password</label>

                <input
                    type="password"
                    id="registerPassword"
                    required>


                <label>Role</label>

                <select id="registerRole">

                    <option value="BUYER">
                        Buyer
                    </option>

                    <option value="SELLER">
                        Seller
                    </option>

                </select>


                <button
                    type="submit"
                    class="primary-btn">

                    Create Account

                </button>

            </form>


            <div
                id="registerMessage"
                class="message">
            </div>

        </div>

    </section>


    <!-- LOGIN -->

    <section id="login" class="section">

        <div class="form-box">

            <h2>Login</h2>

            <form onsubmit="loginUser(event)">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    required>


                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    required>


                <button
                    type="submit"
                    class="primary-btn">

                    Login

                </button>

            </form>


            <div
                id="loginMessage"
                class="message">
            </div>

        </div>

    </section>


    <!-- PRODUCTS -->

    <section id="products" class="section">

        <h2>Products</h2>


        <div class="filter-box">

            <div class="filter-row">

                <div>

                    <label>Search</label>

                    <input
                        type="text"
                        id="searchKeyword"
                        placeholder="Search products...">

                </div>


                <div>

                    <label>Category</label>

                    <select id="searchCategory">

                        <option value="">
                            All Categories
                        </option>

                        <option value="Saree">
                            Saree
                        </option>

                        <option value="Kurti">
                            Kurti
                        </option>

                        <option value="Makeup">
                            Makeup
                        </option>

                        <option value="Fashion">
                            Fashion
                        </option>

                        <option value="Laptop">
                            Laptop
                        </option>

                        <option value="Mobile">
                            Mobile
                        </option>

                    </select>

                </div>


                <button
                    class="primary-btn"
                    onclick="loadProducts()">

                    Search

                </button>

            </div>

        </div>


        <div
            id="productsList"
            class="products-grid">

        </div>

    </section>


    <!-- CART -->

    <section id="cart" class="section">

        <h2>My Cart 🛒</h2>

        <div id="cartList"></div>

        <div id="cartTotal"></div>

    </section>


    <!-- ORDERS -->

    <section id="orders" class="section">

        <h2>My Orders 📦</h2>

        <div id="ordersList"></div>

    </section>


</div>


<footer>

    <p>
        © 2026 Logeshwari Mart
    </p>

</footer>


<script>


// ========================================
// GLOBAL VARIABLES
// ========================================

let USER_ID =
    parseInt(
        localStorage.getItem("userId")
    ) || 0;


// ========================================
// SHOW SECTION
// ========================================

function showSection(sectionId)
{
    const sections =
        document.querySelectorAll(".section");

    sections.forEach(
        function(section)
        {
            section.classList.remove("active");
        }
    );


    const section =
        document.getElementById(sectionId);

    if (section)
    {
        section.classList.add("active");
    }
}


// ========================================
// MESSAGE
// ========================================

function showMessage(
    elementId,
    message,
    success
)
{
    const element =
        document.getElementById(elementId);

    if (!element)
    {
        return;
    }

    element.style.display = "block";

    element.className =
        "message " +
        (success ? "success" : "error");

    element.textContent = message;
}


// ========================================
// REGISTER
// ========================================

async function registerUser(event)
{
    event.preventDefault();


    const name =
        document
            .getElementById("registerName")
            .value
            .trim();


    const email =
        document
            .getElementById("registerEmail")
            .value
            .trim();


    const password =
        document
            .getElementById("registerPassword")
            .value;


    const role =
        document
            .getElementById("registerRole")
            .value;


    try
    {
        const response =
            await fetch(
                "/api/register",
                {
                    method: "POST",

                    headers:
                    {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify(
                    {
                        name: name,
                        email: email,
                        password: password,
                        role: role
                    })
                }
            );


        const data =
            await response.json();


        if (response.ok && data.success)
        {
            showMessage(
                "registerMessage",
                "Registration successful!",
                true
            );

            document
                .getElementById("registerName")
                .value = "";

            document
                .getElementById("registerEmail")
                .value = "";

            document
                .getElementById("registerPassword")
                .value = "";
        }
        else
        {
            showMessage(
                "registerMessage",
                data.message ||
                    "Registration failed.",
                false
            );
        }
    }
    catch (error)
    {
        console.error(error);

        showMessage(
            "registerMessage",
            "Unable to connect to backend.",
            false
        );
    }
}


// ========================================
// LOGIN
// ========================================

async function loginUser(event)
{
    event.preventDefault();


    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();


    const password =
        document
            .getElementById("loginPassword")
            .value;


    try
    {
        const response =
            await fetch(
                "/api/login",
                {
                    method: "POST",

                    headers:
                    {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify(
                    {
                        email: email,
                        password: password
                    })
                }
            );


        const data =
            await response.json();


        if (response.ok && data.success)
        {
            USER_ID =
                data.userId ||
                data.user_id ||
                data.id ||
                0;


            localStorage.setItem(
                "userId",
                USER_ID
            );


            localStorage.setItem(
                "loggedIn",
                "true"
            );


            // IMPORTANT:
            // Save authentication token

            if (data.token)
            {
                localStorage.setItem(
                    "authToken",
                    data.token
                );
            }


            showMessage(
                "loginMessage",
                "Login successful!",
                true
            );


            loadProducts();

            showSection("products");
        }
        else
        {
            showMessage(
                "loginMessage",
                data.message ||
                    "Invalid email or password.",
                false
            );
        }
    }
    catch (error)
    {
        console.error(
            "Login error:",
            error
        );


        showMessage(
            "loginMessage",
            "Unable to connect to backend.",
            false
        );
    }
}


// ========================================
// LOAD PRODUCTS
// ========================================

async function loadProducts()
{
    try
    {
        const keyword =
            document
                .getElementById("searchKeyword")
                ?.value
                .trim() || "";


        const category =
            document
                .getElementById("searchCategory")
                ?.value || "";


        let url =
            "/api/products";


        const params = [];


        if (keyword)
        {
            params.push(
                "keyword=" +
                encodeURIComponent(keyword)
            );
        }


        if (category)
        {
            params.push(
                "category=" +
                encodeURIComponent(category)
            );
        }


        if (params.length > 0)
        {
            url += "?" + params.join("&");
        }


        const response =
            await fetch(
                url,
                {
                    method: "GET",

                    credentials: "include"
                }
            );


        const data =
            await response.json();


        const productsList =
            document.getElementById(
                "productsList"
            );


        productsList.innerHTML = "";


        let products = data;


        if (data.products)
        {
            products = data.products;
        }


        if (!Array.isArray(products))
        {
            products = [];
        }


        if (products.length === 0)
        {
            productsList.innerHTML =
                '<div class="empty">No products found.</div>';

            return;
        }


        products.forEach(
            function(product)
            {
                const card =
                    document.createElement("div");

                card.className =
                    "product-card";


                const price =
                    (
                        Number(
                            product.price_cents || 0
                        ) / 100
                    ).toFixed(2);


                card.innerHTML = `

                    <h3>
                        ${escapeHtml(
                            product.name || "Product"
                        )}
                    </h3>

                    <p>
                        ${escapeHtml(
                            product.description || ""
                        )}
                    </p>

                    <p>
                        Category:
                        ${escapeHtml(
                            product.category || ""
                        )}
                    </p>

                    <p>
                        Stock:
                        ${product.stock_qty || 0}
                    </p>

                    <div class="price">
                        ₹${price}
                    </div>

                    <button
                        class="primary-btn"
                        onclick="addToCart(${product.id})">

                        Add to Cart 🛒

                    </button>
                `;


                productsList.appendChild(card);
            }
        );
    }
    catch (error)
    {
        console.error(
            "Load products error:",
            error
        );


        document.getElementById(
            "productsList"
        ).innerHTML =
            '<div class="empty">Unable to load products.</div>';
    }
}


// ========================================
// ADD TO CART
// ========================================

async function addToCart(productId)
{
    try
    {
        const authToken =
            localStorage.getItem(
                "authToken"
            ) || "";


        if (!authToken)
        {
            alert(
                "Please login first."
            );

            showSection("login");

            return;
        }


        const response =
            await fetch(
                "/api/cart",
                {
                    method: "POST",

                    headers:
                    {
                        "Content-Type":
                            "application/json",

                        "X-Auth-Token":
                            authToken
                    },

                    credentials: "include",

                    body: JSON.stringify(
                    {
                        user_id: USER_ID,
                        product_id: productId,
                        quantity: 1
                    })
                }
            );


        const data =
            await response.json();


        if (response.ok && data.success)
        {
            alert(
                "Product added to cart 🛒"
            );

            loadCart();
        }
        else
        {
            alert(
                data.message ||
                    "Failed to add product to cart"
            );
        }
    }
    catch (error)
    {
        console.error(
            "Add to cart error:",
            error
        );


        alert(
            "Unable to connect to backend"
        );
    }
}


// ========================================
// OPEN CART
// ========================================

function openCart()
{
    if (!USER_ID)
    {
        alert("Please login first.");

        showSection("login");

        return;
    }


    showSection("cart");

    loadCart();
}


// ========================================
// LOAD CART
// ========================================

async function loadCart()
{
    if (!USER_ID)
    {
        return;
    }


    try
    {
        const authToken =
            localStorage.getItem(
                "authToken"
            ) || "";


        const response =
            await fetch(
                "/api/cart/" +
                    USER_ID,
                {
                    method: "GET",

                    headers:
                    {
                        "X-Auth-Token":
                            authToken
                    },

                    credentials: "include"
                }
            );


        const data =
            await response.json();


        const cartList =
            document.getElementById(
                "cartList"
            );


        const cartTotal =
            document.getElementById(
                "cartTotal"
            );


        cartList.innerHTML = "";


        let cart = data;


        if (data.cart)
        {
            cart = data.cart;
        }


        if (!Array.isArray(cart))
        {
            cart = [];
        }


        if (cart.length === 0)
        {
            cartList.innerHTML =
                '<div class="empty">Your cart is empty.</div>';

            cartTotal.innerHTML = "";

            return;
        }


        let total = 0;


        cart.forEach(
            function(item)
            {
                const quantity =
                    item.quantity || 1;


                const price =
                    Number(
                        item.price_cents || 0
                    );


                total +=
                    price * quantity;


                const div =
                    document.createElement("div");


                div.className =
                    "cart-item";


                div.innerHTML = `

                    <h3>
                        ${escapeHtml(
                            item.name ||
                            "Product #" +
                            item.product_id
                        )}
                    </h3>

                    <p>
                        Price:
                        ₹${(
                            price / 100
                        ).toFixed(2)}
                    </p>

                    <p>
                        Quantity:
                        ${quantity}
                    </p>

                `;


                cartList.appendChild(div);
            }
        );


        cartTotal.innerHTML = `

            <div class="cart-total">

                <h3>
                    Total:
                    ₹${(
                        total / 100
                    ).toFixed(2)}
                </h3>

                <br>

                <button
                    class="white-btn"
                    onclick="checkout()">

                    Checkout

                </button>

            </div>
        `;
    }
    catch (error)
    {
        console.error(
            "Cart error:",
            error
        );
    }
}


// ========================================
// CHECKOUT
// ========================================

async function checkout()
{
    if (!USER_ID)
    {
        alert("Please login first.");

        return;
    }


    try
    {
        const authToken =
            localStorage.getItem(
                "authToken"
            ) || "";


        const response =
            await fetch(
                "/api/checkout/" +
                    USER_ID,
                {
                    method: "POST",

                    headers:
                    {
                        "Content-Type":
                            "application/json",

                        "X-Auth-Token":
                            authToken
                    },

                    credentials: "include",

                    body: JSON.stringify(
                    {
                        total_amount_cents: 1
                    })
                }
            );


        const data =
            await response.json();


        if (response.ok && data.success)
        {
            alert(
                "Order placed successfully!"
            );

            openOrders();
        }
        else
        {
            alert(
                data.message ||
                    "Checkout failed."
            );
        }
    }
    catch (error)
    {
        console.error(error);

        alert(
            "Unable to connect to backend."
        );
    }
}


// ========================================
// ORDERS
// ========================================

function openOrders()
{
    if (!USER_ID)
    {
        alert("Please login first.");

        showSection("login");

        return;
    }


    showSection("orders");

    loadOrders();
}


async function loadOrders()
{
    try
    {
        const authToken =
            localStorage.getItem(
                "authToken"
            ) || "";


        const response =
            await fetch(
                "/api/orders/" +
                    USER_ID,
                {
                    method: "GET",

                    headers:
                    {
                        "X-Auth-Token":
                            authToken
                    },

                    credentials: "include"
                }
            );


        const data =
            await response.json();


        const ordersList =
            document.getElementById(
                "ordersList"
            );


        ordersList.innerHTML = "";


        let orders = data;


        if (data.orders)
        {
            orders = data.orders;
        }


        if (!Array.isArray(orders))
        {
            orders = [];
        }


        if (orders.length === 0)
        {
            ordersList.innerHTML =
                '<div class="empty">No orders found.</div>';

            return;
        }


        orders.forEach(
            function(order)
            {
                const div =
                    document.createElement("div");


                div.className =
                    "order-card";


                div.innerHTML = `

                    <h3>
                        Order #${order.id}
                    </h3>

                    <p>
                        Status:
                        ${escapeHtml(
                            order.status || "Placed"
                        )}
                    </p>

                `;


                ordersList.appendChild(div);
            }
        );
    }
    catch (error)
    {
        console.error(
            "Orders error:",
            error
        );
    }
}


// ========================================
// LOGOUT
// ========================================

async function logoutUser()
{
    try
    {
        const authToken =
            localStorage.getItem(
                "authToken"
            ) || "";


        await fetch(
            "/api/logout",
            {
                method: "POST",

                headers:
                {
                    "X-Auth-Token":
                        authToken
                },

                credentials: "include"
            }
        );
    }
    catch (error)
    {
        console.error(error);
    }


    localStorage.removeItem(
        "userId"
    );

    localStorage.removeItem(
        "loggedIn"
    );

    localStorage.removeItem(
        "authToken"
    );


    USER_ID = 0;


    alert("Logged out successfully.");

    showSection("home");
}


// ========================================
// ESCAPE HTML
// ========================================

function escapeHtml(value)
{
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


// ========================================
// PAGE LOAD
// ========================================

window.addEventListener(
    "load",
    function()
    {
        if (USER_ID)
        {
            loadProducts();
        }
    }
);

</script>

</body>

</html>
